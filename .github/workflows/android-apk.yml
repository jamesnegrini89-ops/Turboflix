name: Compilar TurboFlix Android com PiP
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon -p android assembleDebug --stacktrace

      - name: Nomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TurboFlix-Android-PiP-1.8.7.apk

      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: TurboFlix-Android-PiP-1.8.7
          path: TurboFlix-Android-PiP-1.8.7.apk
          retention-days: 90

      - name: Publicar APK no repositório
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TurboFlix-Android-PiP-1.8.7.apk
          git commit -m "build(android): APK TurboFlix PiP 1.8.7" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
