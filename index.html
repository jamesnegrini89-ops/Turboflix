<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0616" />
  <meta name="description" content="TurboFlix - Player IPTV (M3U e Xtream Codes) com DLNA/Cast para TV, Fire TV e celular" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TurboFlix</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css?v=1.8.4" />
  <script>
    // Limpa caches de versões anteriores do Service Worker para garantir carregamento imediato da versão atual
    try {
      if ('caches' in window) {
        caches.keys().then(function(ks) {
          ks.forEach(function(k) { if (k !== 'turboflix-v1.8.4') caches.delete(k); });
        });
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="stars"></div>

  <!-- Barra superior -->
  <header id="topbar">
    <a class="logo" href="#/home" tabindex="-1">
      <span class="logo-play"></span><b>Turbo</b><span class="logo-flix">Flix</span>
    </a>
    <nav id="mainnav">
      <button class="nav-btn focusable" data-route="#/home" data-icon="home">Início</button>
      <button class="nav-btn focusable" data-route="#/mylist" data-icon="bookmark">Minha Lista</button>
      <button class="nav-btn focusable" data-route="#/search" data-icon="search">Buscar</button>
      <button class="nav-btn focusable" data-route="#/settings" data-icon="settings">Configurações</button>
    </nav>
    <div class="clock"><div id="clock-time">--:--</div><div id="clock-date"></div></div>
  </header>

  <main id="view"></main>

  <!-- Player de vídeo -->
  <div id="player" hidden>
    <video id="video" playsinline webkit-playsinline preload="metadata" controlslist="nodownload nofullscreen"></video>
    <div class="p-spinner" id="p-spinner"></div>
    <div class="p-overlay" id="p-overlay">
      <div class="p-top">
        <button class="p-btn focusable" data-p="back" data-icon="back" aria-label="Voltar"></button>
        <div class="p-titles">
          <div class="p-title" id="p-title"></div>
          <div class="p-sub" id="p-sub"></div>
        </div>
        <span class="badge-live" id="p-live">AO VIVO</span>
        <button class="p-btn focusable" data-p="cast" data-icon="cast" title="Transmitir / DLNA" aria-label="Transmitir / DLNA"></button>
        <button class="p-btn focusable" data-p="fav" data-icon="heart" aria-label="Minha Lista"></button>
      </div>
      <div class="p-bottom">
        <div class="p-bar" id="p-bar"><div class="p-buf" id="p-buf"></div><div class="p-fill" id="p-fill"></div></div>
        <div class="p-row">
          <button class="p-btn focusable" data-p="prev" data-icon="prev" aria-label="Anterior"></button>
          <button class="p-btn focusable" data-p="rw" data-icon="replay10" aria-label="Voltar 10s"></button>
          <button class="p-btn p-main focusable" data-p="play" data-icon="pause" aria-label="Play/Pause"></button>
          <button class="p-btn focusable" data-p="ff" data-icon="forward10" aria-label="Avançar 10s"></button>
          <button class="p-btn focusable" data-p="next" data-icon="next" aria-label="Próximo"></button>
          <span class="p-time" id="p-time"></span>
          <span class="p-flex"></span>
          <span class="p-hint" id="p-hint"></span>
          <button class="p-btn focusable" data-p="cast" data-icon="cast" title="Transmitir / DLNA" aria-label="Transmitir / DLNA"></button>
          <button class="p-btn focusable" data-p="fs" data-icon="fullscreen" aria-label="Tela cheia"></button>
        </div>
      </div>
    </div>
    <div class="p-zap" id="p-zap" hidden></div>
    <div class="p-error" id="p-error" hidden></div>
    <div class="p-cast-modal" id="p-cast-modal" hidden></div>
  </div>

  <div id="loading" hidden><div class="spinner"></div><div id="loading-msg">Carregando...</div></div>
  <div id="toast" hidden></div>

  <script type="module" src="js/app.js?v=1.8.4"></script>
</body>
</html>
