plugins { id 'com.android.application' }

android {
    namespace 'com.turboflix.pip'
    compileSdk 35

    defaultConfig {
        applicationId 'com.turboflix.pip'
        minSdk 26
        targetSdk 34
        versionCode 187
        versionName '1.8.7'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
